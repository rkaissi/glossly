# Builds a release on GitHub's Windows machines when a version tag is pushed (decision 73).
# `node scripts/release.mjs tag <version>` pushes the tag; this builds the installer from that
# commit and uploads it, its .blockmap, and latest.yml to a draft release. Drafts are invisible to
# installed copies, so nothing ships until `release.mjs publish` adds the notes and publishes it.
# Run it by hand (Actions > Release > Run workflow) to build the current main without releasing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm typecheck
          pnpm test

      - name: Build the installer
        run: pnpm dist

      - name: Verify
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || v=$(node -p "require('./packages/shell-electron/package.json').version")
          node scripts/release.mjs verify "$v"

      - name: Upload to a draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          d=packages/shell-electron/dist
          pre=""
          [[ "$v" == *-* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" "$d/Glossly-Setup-$v.exe" "$d/Glossly-Setup-$v.exe.blockmap" "$d/latest.yml" \
            --draft --verify-tag $pre --title "Glossly $v" \
            --notes "Built by GitHub Actions from $GITHUB_SHA. Notes to come: release.mjs publish replaces this and publishes."
